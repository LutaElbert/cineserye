name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CINESERYE_E2E_FIXTURE: 'true'
  CINESERYE_PROVIDER_MODE: fixture
  CINESERYE_LIVE_ENABLED: 'false'
  CINESERYE_RUN_VIDEO_SMOKE: '0'
  CINESERYE_RUN_STORYBOARD_SMOKE: '0'
  CINESERYE_RUN_VERTEX_SMOKE: '0'
  CINESERYE_RUN_STORY_LIVE_SMOKE: '0'
  CINESERYE_REQUIRE_RENDERER_TESTS: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Require native renderer tools (no capability skips)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm run check:test-environment
      - run: npm run check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:client-boundary
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Built native Node fixture workflow matrix
        run: npm run test:built:node
      - name: Built local Worker compatibility and negative matrix
        run: npm run test:built:worker
